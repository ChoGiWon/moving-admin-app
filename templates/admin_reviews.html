<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>관리자 - 이사 후기 관리</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .admin-container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff9800;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin: 0;
        }

        /* 관리자 상단 우측 버튼 그룹 스타일 */
        .admin-nav-btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .top-action-btn,
        .external-link-btn,
        .back-admin-btn,
        .logout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 135px;
            padding: 8px 0;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            box-sizing: border-box;
            text-align: center;
        }

        .back-admin-btn {
            background: #007bff;
            color: #ffffff;
            border: 1px solid #0056b3;
        }

        .back-admin-btn:hover {
            background: #0056b3;
        }

        .external-link-btn {
            background: #6f42c1;
            color: #ffffff;
            border: 1px solid #5a32a3;
        }

        .external-link-btn:hover {
            background: #5a32a3;
        }

        .logout-btn {
            background: #dc3545;
            color: #ffffff;
            border: 1px solid #c82333;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .home-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .admin-review-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .form-row input[type="text"], .form-row textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-row input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background: #fff;
            box-sizing: border-box;
        }

        .add-btn, .submit-btn {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .add-btn {
            background: #28a745;
            margin-bottom: 20px;
        }

        .add-btn:hover {
            background: #218838;
        }

        .submit-btn:hover {
            background: #e68900;
        }

        .preview-thumbs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .preview-thumbs img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- 상단 내비게이션 영역 -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
            <a href="/" class="home-link" style="margin-bottom: 0; padding-top: 5px;">&lsaquo; 홈페이지로 돌아가기</a>
            
            <div class="admin-nav-btn-group">
                <a href="/admin" class="top-action-btn back-admin-btn">📋 관리자 메인</a>
                <!-- 💡 iloveimg 외부 브라우저 연결 버튼 추가 -->
                <a href="https://www.iloveimg.com/ko" target="_blank" rel="noopener noreferrer"
                    class="external-link-btn" onclick="openExternalBrowser(event, 'https://www.iloveimg.com/ko')">
                    🔗 iloveimg 열기
                </a>
                <a href="/admin/logout" class="top-action-btn logout-btn">🔒 로그아웃</a>
            </div>
        </div>

        <div class="header-wrap">
            <h2>📝 이사 후기 / 현장 스케치 관리</h2>
        </div>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">
            홈 화면 7번 항목에 노출될 후기 및 사진을 직접 추가/수정합니다.
        </p>

        <form action="/admin/reviews" method="POST" enctype="multipart/form-data">
            <button type="button" class="add-btn" onclick="addReviewForm()">➕ 후기 항목 추가하기</button>

            <div id="reviewFormContainer">
                {% if reviews %}
                    {% for review in reviews %}
                    <div class="admin-review-item" id="item-{{ loop.index0 }}">
                        <h4 style="margin-top: 0; color: #333;">후기 #{{ loop.index }}</h4>
                        <div class="form-row">
                            <label>지역</label>
                            <input type="text" name="region" value="{{ review.region }}" placeholder="예: 천안시 동남구" required>
                        </div>
                        <div class="form-row">
                            <label>글 제목</label>
                            <input type="text" name="title" value="{{ review.title }}" placeholder="예: 깔끔하고 신속한 이사 서비스!" required>
                        </div>
                        <div class="form-row">
                            <label>글 내용</label>
                            <textarea name="content" rows="3" required>{{ review.content }}</textarea>
                        </div>
                        <div class="form-row">
                            <label>사진 파일 선택 (PC/사진첩)</label>
                            <!-- 💡 capture 속성을 완전히 제거하여 카메라 직행 방지 -->
                            <input type="file" name="images_{{ loop.index0 }}" accept="image/*" multiple onchange="previewImages(this, {{ loop.index0 }})">
                            
                            <div class="preview-thumbs" id="preview_{{ loop.index0 }}">
                                {% for img in review.images %}
                                <img src="{{ img }}" alt="등록된 사진">
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <!-- 기본 1개 폼 제공 -->
                    <div class="admin-review-item" id="item-0">
                        <h4 style="margin-top: 0; color: #333;">후기 #1</h4>
                        <div class="form-row">
                            <label>지역</label>
                            <input type="text" name="region" placeholder="예: 천안시 동남구" required>
                        </div>
                        <div class="form-row">
                            <label>글 제목</label>
                            <input type="text" name="title" placeholder="예: 깔끔하고 신속한 이사 서비스!" required>
                        </div>
                        <div class="form-row">
                            <label>글 내용</label>
                            <textarea name="content" rows="3" required></textarea>
                        </div>
                        <div class="form-row">
                            <label>사진 파일 선택 (PC/사진첩)</label>
                            <input type="file" name="images_0" accept="image/*" multiple onchange="previewImages(this, 0)">
                            <div class="preview-thumbs" id="preview_0"></div>
                        </div>
                    </div>
                {% endif %}
            </div>

            <button type="submit" class="submit-btn">💾 전체 저장하기</button>
        </form>
    </div>

    <script>
        // 💡 모바일 환경에서 인앱 웹뷰 대신 기본 브라우저 앱으로 열리도록 유도하는 함수
        function openExternalBrowser(event, url) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                event.preventDefault();
                const cleanUrl = url.replace('https://', '').replace('http://', '');
                window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
            }
        }

        let itemCount = document.querySelectorAll('.admin-review-item').length;

        function addReviewForm() {
            const container = document.getElementById('reviewFormContainer');
            const div = document.createElement('div');
            div.className = 'admin-review-item';
            div.id = `item-${itemCount}`;
            div.innerHTML = `
                <h4 style="margin-top: 0; color: #333;">후기 #${itemCount + 1}</h4>
                <div class="form-row">
                    <label>지역</label>
                    <input type="text" name="region" placeholder="예: 아산시 배방읍" required>
                </div>
                <div class="form-row">
                    <label>글 제목</label>
                    <input type="text" name="title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-row">
                    <label>글 내용</label>
                    <textarea name="content" rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <label>사진 파일 선택 (PC/사진첩)</label>
                    <input type="file" name="images_${itemCount}" accept="image/*" multiple onchange="previewImages(this, ${itemCount})">
                    <div class="preview-thumbs" id="preview_${itemCount}"></div>
                </div>
            `;
            container.appendChild(div);
            itemCount++;
        }

        // 선택한 사진 미리보기 기능
        function previewImages(input, index) {
            const previewContainer = document.getElementById(`preview_${index}`);
            if (input.files && input.files.length > 0) {
                for (let i = 0; i < input.files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        previewContainer.appendChild(img);
                    }
                    reader.readAsDataURL(input.files[i]);
                }
            }
        }
    </script>
</body>

</html>
